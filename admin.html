<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eitt fjall á viku – stjórnandi</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#142033}
.app{display:grid;grid-template-columns:280px 1fr;height:100vh}.side{background:#fff;border-right:1px solid #dbe3ef;padding:12px;overflow:auto}
h1{font-size:1.2rem;margin:0 0 8px}.box{background:#eef6ff;border:1px solid #bfd9ff;padding:9px;border-radius:10px;margin-bottom:10px;font-size:.86rem;line-height:1.4}
.search{width:100%;padding:9px;border:1px solid #ccd7e5;border-radius:9px;margin-bottom:8px}
.btn{width:100%;border:0;border-radius:9px;padding:10px;font-weight:700;cursor:pointer;margin-bottom:8px}.primary{background:#1877f2;color:white}
.row{border:1px solid #dbe3ef;border-radius:10px;padding:8px 9px;margin:5px 0;background:#fbfcff;cursor:grab;user-select:none}.row.placed{background:#f1fff5;border-color:#a9d8b6}
.name{font-weight:700}.meta{font-size:.82rem;color:#607389;margin-top:3px}#map{width:100%;height:100%}
.leaflet-tooltip.mountain-label{font-weight:700;background:#fff;border:1px solid #6d7f91}.status{font-size:.84rem;margin:4px 0 8px}
</style></head>
<body>
<div class="app">
<aside class="side">
<h1>Stjórnandi</h1>
<div class="box">Aðeins hér færir þú fjöll. Public síðan <b>index.html</b> er föst og enginn sem fær public linkinn getur fært fjöllin.</div>
<button id="downloadJson" class="btn primary">Vista staðsetningar</button>
<div id="status" class="status"></div>
<input id="search" class="search" placeholder="Leita að fjalli…">
<div id="list"></div>
</aside>
<main id="map"></main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let mountains=[];
const map=L.map('map').setView([64.7,-18.7],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const markerById=new Map();

function saveLocal(){localStorage.setItem('fjoll119',JSON.stringify(mountains));}
function makeMarker(m,latlng){
 m.lat=latlng.lat;m.lng=latlng.lng;
 let marker=markerById.get(m.id);
 if(!marker){
   marker=L.marker(latlng,{draggable:true}).addTo(map);
   marker.bindTooltip(m.name,{permanent:true,direction:'top',offset:[0,-10],className:'mountain-label'});
   marker.on('dragend',e=>{const p=e.target.getLatLng();m.lat=p.lat;m.lng=p.lng;saveLocal();renderList(search.value)});
   markerById.set(m.id,marker);
 }else marker.setLatLng(latlng);
 saveLocal();renderList(search.value);
}
function renderList(filter=''){
 const q=filter.trim().toLowerCase(),list=document.getElementById('list');list.innerHTML='';let placed=0;
 mountains.forEach(m=>{
  if(m.lat!==null&&m.lng!==null)placed++;
  if(q&&!m.name.toLowerCase().includes(q))return;
  const row=document.createElement('div');row.className='row'+(m.lat!==null?' placed':'');row.draggable=true;
  row.innerHTML=`<div class="name">${m.id}. ${m.name}</div><div class="meta">${m.lat!==null?'✓ staðsett':'Dragðu á kortið'}</div>`;
  row.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',String(m.id)));
  row.onclick=()=>{const marker=markerById.get(m.id);if(marker){map.setView(marker.getLatLng(),11)}};
  list.appendChild(row);
 });
 status.textContent=`${placed} af ${mountains.length} fjöllum staðsett`;
}
const mapEl=document.getElementById('map');
mapEl.addEventListener('dragover',e=>e.preventDefault());
mapEl.addEventListener('drop',e=>{
 e.preventDefault();const id=Number(e.dataTransfer.getData('text/plain')),m=mountains.find(x=>x.id===id);
 if(!m)return;const rect=mapEl.getBoundingClientRect(),pt=L.point(e.clientX-rect.left,e.clientY-rect.top);
 makeMarker(m,map.containerPointToLatLng(pt));
});
downloadJson.addEventListener('click',()=>{
 const blob=new Blob([JSON.stringify(mountains,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fjoll.json';
 document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
 status.textContent='Vistað. Settu þessa fjoll.json í GitHub og public kortið notar föstu staðsetningarnar.';
});
search.addEventListener('input',e=>renderList(e.target.value));
async function start(){
 const r=await fetch('fjoll.json?ts='+Date.now());mountains=await r.json();
 try{
  const old=JSON.parse(localStorage.getItem('fjoll119')||'null');
  if(Array.isArray(old)){
   const byId=new Map(old.map(x=>[x.id,x]));
   mountains=mountains.map(m=>{const x=byId.get(m.id);return x&&x.lat!==null&&x.lng!==null?{...m,lat:x.lat,lng:x.lng,facebookUrl:x.facebookUrl||m.facebookUrl}:m});
  }
 }catch(e){}
 mountains.forEach(m=>{if(m.lat!==null&&m.lng!==null)makeMarker(m,L.latLng(m.lat,m.lng))});
 renderList();
}
start().catch(()=>status.textContent='Gat ekki lesið fjoll.json.');
</script>
</body></html>
