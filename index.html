<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eitt fjall á viku</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#142033}
.app{display:grid;grid-template-columns:280px 1fr;height:100vh}
.side{background:white;border-right:1px solid #dbe3ef;padding:12px;overflow:auto}
h1{font-size:1.2rem;margin:0 0 8px}
p{font-size:.92rem;line-height:1.4;margin:0 0 10px}
.search{width:100%;padding:9px;border:1px solid #ccd7e5;border-radius:9px;margin-bottom:8px}
.row{border:1px solid #dbe3ef;border-radius:10px;padding:8px 9px;margin:5px 0;background:#fbfcff;cursor:pointer;user-select:none}
.row.placed{background:#f1fff5;border-color:#a9d8b6}
.name{font-weight:700}.meta{font-size:.82rem;color:#607389;margin-top:3px}
#map{width:100%;height:100%}
.leaflet-tooltip.mountain-label{font-weight:700;background:#fff;border:1px solid #6d7f91}
.popupbtn{display:inline-block;background:#1877f2;color:#fff;text-decoration:none;padding:8px 10px;border-radius:8px;margin-top:8px;font-weight:700}
.status{font-size:.84rem;margin-bottom:8px}
@media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:42vh 58vh}.side{border-right:0;border-bottom:1px solid #dbe3ef}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<h1>Eitt fjall á viku</h1>
<p>Smelltu á fjall til að skoða staðsetningu og 360° mynd þegar hún er til.</p>
<input id="search" class="search" placeholder="Leita að fjalli…">
<div id="status" class="status"></div>
<div id="list"></div>
</aside>
<main id="map"></main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let mountains=[];
const map=L.map('map').setView([64.7,-18.7],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const markerById=new Map();

function popupHtml(m){
 const fb=m.facebookUrl
  ? `<a class="popupbtn" href="${m.facebookUrl}" target="_blank" rel="noopener">Opna 360° á Facebook</a>`
  : `<div style="margin-top:8px;color:#6f7d8b">360° link vantar</div>`;
 return `<b>${m.id}. ${m.name}</b><br>${fb}`;
}

function renderList(filter=''){
 const q=filter.trim().toLowerCase(), list=document.getElementById('list');
 list.innerHTML=''; let placed=0;
 mountains.forEach(m=>{
   const isPlaced=m.lat!==null&&m.lng!==null;
   if(isPlaced) placed++;
   if(q&&!m.name.toLowerCase().includes(q)) return;
   const row=document.createElement('div');
   row.className='row'+(isPlaced?' placed':'');
   row.innerHTML=`<div class="name">${m.id}. ${m.name}</div><div class="meta">${isPlaced?'✓ staðsett':'ekki staðsett enn'}</div>`;
   row.onclick=()=>{
     const marker=markerById.get(m.id);
     if(marker){map.setView(marker.getLatLng(),11);marker.openPopup()}
   };
   list.appendChild(row);
 });
 status.textContent=`${placed} af ${mountains.length} fjöllum staðsett`;
}

async function loadData(){
  const r=await fetch('fjoll.json?ts='+Date.now());
  if(!r.ok) throw new Error('Gat ekki lesið fjoll.json');
  mountains=await r.json();

  const bounds=[];
  mountains.forEach(m=>{
    if(m.lat!==null&&m.lng!==null){
      const marker=L.marker([m.lat,m.lng],{draggable:false}).addTo(map);
      marker.bindTooltip(m.name,{permanent:false,direction:'top',offset:[0,-10],className:'mountain-label'});
      marker.bindPopup(popupHtml(m));
      markerById.set(m.id,marker);
      bounds.push([m.lat,m.lng]);
    }
  });

  if(bounds.length>1){map.fitBounds(bounds,{padding:[25,25],maxZoom:7})}
  renderList();
}

search.addEventListener('input',e=>renderList(e.target.value));
loadData().catch(()=>{status.textContent='Gat ekki lesið fjoll.json.'});
</script>
</body>
</html>
