<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eitt fjall á viku</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#142033}
.app{display:grid;grid-template-columns:280px 1fr;height:100vh}
.side{background:white;border-right:1px solid #dbe3ef;padding:12px;overflow:auto}
h1{font-size:1.2rem;margin:0 0 8px}
p{font-size:.92rem;line-height:1.4;margin:0 0 10px}
.help{background:#eef6ff;border:1px solid #bfd9ff;padding:9px;border-radius:10px;margin-bottom:10px;font-size:.88rem}
.search{width:100%;padding:9px;border:1px solid #ccd7e5;border-radius:9px;margin-bottom:8px}
.btn{width:100%;border:0;border-radius:9px;padding:10px;font-weight:700;cursor:pointer;margin-bottom:8px}
.save{background:#1877f2;color:white}
.row{border:1px solid #dbe3ef;border-radius:10px;padding:8px 9px;margin:5px 0;background:#fbfcff;cursor:grab;user-select:none}
.row.placed{background:#f1fff5;border-color:#a9d8b6}
.name{font-weight:700}.meta{font-size:.82rem;color:#607389;margin-top:3px}
#map{width:100%;height:100%}
.leaflet-tooltip.mountain-label{font-weight:700;background:#fff;border:1px solid #6d7f91}
.popupbtn{display:inline-block;background:#1877f2;color:#fff;text-decoration:none;padding:8px 10px;border-radius:8px;margin-top:8px;font-weight:700}
.smallbtn{border:0;background:#eef1f5;padding:7px 9px;border-radius:8px;cursor:pointer;margin-top:8px}
.status{font-size:.84rem;margin-bottom:8px}
@media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:42vh 58vh}.side{border-right:0;border-bottom:1px solid #dbe3ef}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<h1>Eitt fjall á viku</h1>
<p>Dragðu fjöll á kortið. Staðsetningar á GitHub birtast á öllum tækjum.</p>
<div class="help"><b>Vinnuferli:</b> færa fjöll → ýta á „Vista staðsetningar“ → setja niðurhalaða <code>fjoll.json</code> í GitHub repository-ið.</div>
<input id="search" class="search" placeholder="Leita að fjalli…">
<button id="saveBtn" class="btn save">Vista staðsetningar</button>
<div id="status" class="status"></div>
<div id="list"></div>
</aside>
<main id="map"></main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let mountains=[];
const map=L.map('map').setView([64.7,-18.7],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const markerById=new Map();

async function loadData(){
  const r=await fetch('fjoll.json?ts='+Date.now());
  mountains=await r.json();

  // Merge in unsaved work from this browser, if present.
  try{
    const local=JSON.parse(localStorage.getItem('fjoll119')||'null');
    if(Array.isArray(local)){
      const byId=new Map(local.map(x=>[x.id,x]));
      mountains=mountains.map(m=>{
        const x=byId.get(m.id);
        return x ? {...m,lat:x.lat,lng:x.lng,facebookUrl:x.facebookUrl||m.facebookUrl} : m;
      });
    }
  }catch(e){}
  restoreMarkers(); renderList();
}

function saveLocal(){ localStorage.setItem('fjoll119',JSON.stringify(mountains)); }

function popupHtml(m){
 const fb=m.facebookUrl
  ? `<a class="popupbtn" href="${m.facebookUrl}" target="_blank" rel="noopener">Opna 360° á Facebook</a>`
  : `<div style="margin-top:8px;color:#6f7d8b">360° link vantar</div>`;
 return `<b>${m.id}. ${m.name}</b><br>${m.lat?.toFixed(5)||''}, ${m.lng?.toFixed(5)||''}<br>${fb}<br>
 <button class="smallbtn" onclick="removeMountain(${m.id})">Fjarlægja punkt</button>`;
}

function createOrMoveMarker(m,latlng){
 m.lat=latlng.lat; m.lng=latlng.lng;
 let marker=markerById.get(m.id);
 if(!marker){
   marker=L.marker(latlng,{draggable:true}).addTo(map);
   marker.bindTooltip(m.name,{permanent:true,direction:'top',offset:[0,-10],className:'mountain-label'});
   marker.on('dragend',e=>{
     const p=e.target.getLatLng(); m.lat=p.lat; m.lng=p.lng;
     marker.setPopupContent(popupHtml(m)); saveLocal(); renderList(search.value);
   });
   markerById.set(m.id,marker);
 }else marker.setLatLng(latlng);
 marker.setPopupContent(popupHtml(m));
 saveLocal(); renderList(search.value);
}

window.removeMountain=id=>{
 const m=mountains.find(x=>x.id===id), marker=markerById.get(id);
 if(marker){map.removeLayer(marker);markerById.delete(id)}
 m.lat=null;m.lng=null;saveLocal();renderList(search.value);
};

function restoreMarkers(){
 mountains.forEach(m=>{
   if(m.lat!==null&&m.lng!==null) createOrMoveMarker(m,L.latLng(m.lat,m.lng));
 });
}

function renderList(filter=''){
 const q=filter.trim().toLowerCase(), list=document.getElementById('list');
 list.innerHTML=''; let placed=0,shown=0;
 mountains.forEach(m=>{
   if(m.lat!==null&&m.lng!==null) placed++;
   if(q&&!m.name.toLowerCase().includes(q)) return;
   shown++;
   const row=document.createElement('div');
   row.className='row'+(m.lat!==null?' placed':'');
   row.draggable=true;
   row.innerHTML=`<div class="name">${m.id}. ${m.name}</div><div class="meta">${m.lat!==null?'✓ staðsett':'Dragðu á kortið'}</div>`;
   row.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',String(m.id));e.dataTransfer.effectAllowed='move'});
   row.onclick=()=>{const marker=markerById.get(m.id);if(marker){map.setView(marker.getLatLng(),11);marker.openPopup()}};
   list.appendChild(row);
 });
 status.textContent=`${placed} af ${mountains.length} staðsett`;
}

const mapEl=document.getElementById('map');
mapEl.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move'});
mapEl.addEventListener('drop',e=>{
 e.preventDefault();const id=Number(e.dataTransfer.getData('text/plain')),m=mountains.find(x=>x.id===id);
 if(!m)return;
 const rect=mapEl.getBoundingClientRect(),pt=L.point(e.clientX-rect.left,e.clientY-rect.top);
 createOrMoveMarker(m,map.containerPointToLatLng(pt));
 const marker=markerById.get(id);if(marker)marker.openPopup();
});

saveBtn.addEventListener('click',()=>{
 const blob=new Blob([JSON.stringify(mountains,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='fjoll.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
 status.textContent='Vistað. Settu nýju fjoll.json skrána í GitHub til að samstilla öll tæki.';
});

search.addEventListener('input',e=>renderList(e.target.value));
loadData().catch(err=>{status.textContent='Gat ekki lesið fjoll.json. Opnaðu síðuna í gegnum GitHub Pages.'});
</script>
</body>
</html>
