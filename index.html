<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#142033}
.app{display:grid;grid-template-columns:280px 1fr;height:100vh}
.side{background:#fff;border-right:1px solid #dbe3ef;padding:12px;overflow:auto}
h1{font-size:1.2rem;margin:0 0 8px}
p{line-height:1.42;margin:0 0 12px}
.help{background:#eef6ff;border:1px solid #bfd9ff;padding:11px;border-radius:12px;margin-bottom:12px;font-size:.92rem}
.search{width:100%;padding:10px 12px;border:1px solid #ccd7e5;border-radius:10px;margin-bottom:10px}
.stat{font-weight:700;margin:8px 0 12px}
.row{border:1px solid #dbe3ef;border-radius:11px;padding:8px 9px;margin:5px 0;background:#fbfcff;cursor:grab;user-select:none}
.row:active{cursor:grabbing}
.row.placed{background:#f1fff5;border-color:#a9d8b6}
.name{font-weight:700}
.meta{font-size:.86rem;color:#607389;margin-top:3px}
#map{width:100%;height:100%}
.leaflet-tooltip.mountain-label{font-weight:700;background:white;border:1px solid #6d7f91;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.popupbtn{display:inline-block;background:#1877f2;color:#fff;text-decoration:none;padding:8px 10px;border-radius:8px;margin-top:8px;font-weight:700}
.smallbtn{border:0;background:#eef1f5;padding:7px 9px;border-radius:8px;cursor:pointer;margin-top:8px}
@media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:45vh 55vh}.side{border-right:0;border-bottom:1px solid #dbe3ef}}
</style>
</head>

<input id="search" class="search" placeholder="Leita að fjalli…">
<div id="stat" class="stat"></div>
<div id="list"></div>
</aside>

const map = L.map('map').setView([64.7,-18.7],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const markerById = new Map();

function save() {
  localStorage.setItem('fjoll119', JSON.stringify(mountains));
}

function loadSaved() {
  try {
    const saved = JSON.parse(localStorage.getItem('fjoll119') || 'null');
    if (Array.isArray(saved) && saved.length === mountains.length) {
      for (let i=0;i<mountains.length;i++) {
        mountains[i].lat = saved[i].lat;
        mountains[i].lng = saved[i].lng;
      }
    }
  } catch(e) {}
}

function popupHtml(m) {
  const fb = m.facebookUrl
    ? `<a class="popupbtn" href="${m.facebookUrl}" target="_blank" rel="noopener">Opna 360° á Facebook</a>`
    : `<div style="margin-top:8px;color:#6f7d8b">360° link vantar</div>`;
  return `<b>${m.id}. ${m.name}</b><br>
          ${m.lat?.toFixed(5) || ''}, ${m.lng?.toFixed(5) || ''}<br>
          ${fb}<br>
          <button class="smallbtn" onclick="removeMountain(${m.id})">Fjarlægja punkt</button>`;
}

function createOrMoveMarker(m, latlng) {
  m.lat = latlng.lat;
  m.lng = latlng.lng;

  let marker = markerById.get(m.id);
  if (!marker) {
    marker = L.marker(latlng, {draggable:true}).addTo(map);
    marker.bindTooltip(m.name, {
      permanent: true,
      direction: 'top',
      offset: [0,-10],
      className:'mountain-label'
    });
    marker.on('dragend', e => {
      const p = e.target.getLatLng();
      m.lat = p.lat; m.lng = p.lng;
      marker.setPopupContent(popupHtml(m));
      save(); renderList(document.getElementById('search').value);
    });
    markerById.set(m.id, marker);
  } else {
    marker.setLatLng(latlng);
  }
  marker.setPopupContent(popupHtml(m));
  save();
  renderList(document.getElementById('search').value);
}

window.removeMountain = function(id) {
  const m = mountains.find(x=>x.id===id);
  const marker = markerById.get(id);
  if(marker) { map.removeLayer(marker); markerById.delete(id); }
  m.lat = null; m.lng = null;
  save(); renderList(document.getElementById('search').value);
};

function restoreMarkers() {
  mountains.forEach(m => {
    if(m.lat !== null && m.lng !== null) {
      createOrMoveMarker(m, L.latLng(m.lat,m.lng));
    }
  });
}

function renderList(filter='') {
  const q = filter.trim().toLowerCase();
  const list = document.getElementById('list');
  list.innerHTML = '';
  let shown=0, placed=0;
  mountains.forEach(m => {
    if(m.lat!==null && m.lng!==null) placed++;
    if(q && !m.name.toLowerCase().includes(q)) return;
    shown++;
    const row = document.createElement('div');
    row.className = 'row' + (m.lat!==null ? ' placed':'');
    row.draggable = true;
    row.dataset.id = m.id;
    row.innerHTML = `<div class="name">${m.id}. ${m.name}</div>
      <div class="meta">${m.lat!==null ? '✓ staðsett – dragðu punktinn til að færa' : 'Dragðu á kortið'}</div>`;
    row.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', String(m.id));
      e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('click', () => {
      const marker = markerById.get(m.id);
      if(marker) {
        map.setView(marker.getLatLng(), 11);
        marker.openPopup();
      }
    });
    list.appendChild(row);
  });
  document.getElementById('stat').textContent = `${placed} af ${mountains.length} fjöllum staðsett · ${shown} sýnd`;
}

const mapEl = document.getElementById('map');
mapEl.addEventListener('dragover', e => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
});
mapEl.addEventListener('drop', e => {
  e.preventDefault();
  const id = Number(e.dataTransfer.getData('text/plain'));
  const m = mountains.find(x=>x.id===id);
  if(!m) return;

  const rect = mapEl.getBoundingClientRect();
  const point = L.point(e.clientX - rect.left, e.clientY - rect.top);
  const latlng = map.containerPointToLatLng(point);
  createOrMoveMarker(m, latlng);
  const marker = markerById.get(id);
  if(marker) marker.openPopup();
});

loadSaved();
restoreMarkers();
renderList();
document.getElementById('search').addEventListener('input', e=>renderList(e.target.value));
</script>
